<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Couple App</title>
  
  <!-- PWA Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff4b2b">
  
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #1a1a1a; color: white; margin: 0; }
    
    /* Install Screen Styling */
    #install-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    .install-btn { background: #ff4b2b; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 25px; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4); }
    
    /* Main App Content (Hidden by Default) */
    #main-app { display: none; padding: 20px; }
  </style>
</head>
<body>

  <!-- 1. Screen for Website Users (Install Button Only) -->
  <div id="install-screen">
    <h2>Welcome to Couple App ❤️</h2>
    <p>App-ah thunaiyaa use panna install pannunga!</p>
    <button id="installBtn" class="install-btn" style="display:none;">Install App</button>
  </div>

  <!-- 2. Screen inside Installed App -->
  <div id="main-app">
    <h1>Welcome Inside the App! 🎉</h1>
    <!-- Unga app-oda matha features, images, components ellam inga varum -->
  </div>

  <script>
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    const installScreen = document.getElementById('install-screen');
    const mainApp = document.getElementById('main-app');

    // Check if opening as Standalone Installed App
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
      installScreen.style.display = 'none';
      mainApp.style.display = 'block';
    }

    // Capture install prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    // Install Button Click Handler
    installBtn.addEventListener('click', () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('User installed the PWA');
          }
          deferredPrompt = null;
        });
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WhatsApp</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div class="app-container">

    <!-- SCREEN 1: LOGIN -->
    <div id="screen-login" class="screen active">
      <div class="auth-box">
        <i class="fa-brands fa-whatsapp main-icon"></i>
        <h2>WhatsApp</h2>
        <p class="subtitle">Sign in to continue</p>
        <button class="google-btn" onclick="loginWithGoogle()">
          <i class="fa-brands fa-google"></i> Continue with Google
        </button>
      </div>
    </div>

    <!-- SCREEN 2: HOME SCREEN -->
    <div id="screen-home" class="screen">
      <div class="chat-header">
        <h3>WhatsApp</h3>
        <div class="header-actions">
          <i class="fa-solid fa-ellipsis-vertical" onclick="toggleHomeMenu()"></i>
        </div>
        <div id="home-menu" class="menu-dropdown hidden">
          <div class="menu-item" onclick="openProfileView(currentUserData)"><i class="fa-solid fa-user"></i> My Profile</div>
          <div class="menu-item" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</div>
        </div>
      </div>

      <div class="search-section">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="email" id="search-email-input" placeholder="Search user by Email..." onkeyup="searchUser()">
        </div>
        <div id="search-results" class="search-results-list hidden"></div>
      </div>

      <div class="chat-list-section">
        <h4>Chats</h4>
        <div id="recent-chats-list"></div>
      </div>
    </div>

    <!-- SCREEN 3: CHAT ROOM -->
    <div id="screen-chat" class="screen">
      <div class="chat-header">
        <div class="user-info" style="display:flex; align-items:center; gap:10px;">
          <i class="fa-solid fa-arrow-left back-btn" onclick="openHome()" style="cursor:pointer;"></i>
          <img id="chat-header-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" style="width:38px; height:38px; border-radius:50%;" onclick="openActivePartnerProfile()">
          <div onclick="openActivePartnerProfile()" style="cursor:pointer;">
            <h4 id="chat-header-name" style="font-size:15px;">User</h4>
            <span id="chat-header-status" class="user-status-text offline">Offline</span>
          </div>
        </div>
        <div class="header-actions">
          <i class="fa-solid fa-video call-btn" onclick="startCall('video')"></i>
          <i class="fa-solid fa-phone call-btn" onclick="startCall('voice')"></i>
          <i class="fa-solid fa-ellipsis-vertical" onclick="toggleChatMenu()"></i>
        </div>
        <div id="chat-menu" class="menu-dropdown hidden">
          <div class="menu-item" onclick="openActivePartnerProfile()"><i class="fa-solid fa-id-card"></i> View Profile</div>
          <div class="menu-item" onclick="openColorPicker()"><i class="fa-solid fa-palette"></i> Custom Chat Color</div>
        </div>
      </div>

      <div class="chat-messages" id="chat-box"></div>

      <div class="chat-input-area">
        <label for="img-attach" class="attach-btn" title="Send Image">
          <i class="fa-solid fa-paperclip"></i>
        </label>
        <input type="file" id="img-attach" accept="image/*" style="display:none;" onchange="sendMediaMessage(event)">

        <input type="text" id="msg-input" placeholder="Type a message...">

        <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane" style="color:#00a884;"></i></button>
      </div>
    </div>

    <!-- MODAL 1: PROFILE VIEW -->
    <div id="profile-modal" class="custom-modal hidden">
      <div class="modal-content">
        <i class="fa-solid fa-xmark" onclick="closeModal('profile-modal')" style="position:absolute; top:15px; right:15px; font-size:20px; cursor:pointer;"></i>
        <h3 id="profile-modal-name">User Profile</h3>
        <img id="profile-modal-img" class="profile-img-large" src="" alt="Profile Photo">
        <p id="profile-modal-email" style="color:#8696a0; font-size:13px;"></p>
        <p id="profile-modal-bio" style="margin-top:10px; font-size:14px;"></p>
      </div>
    </div>

    <!-- MODAL 2: CUSTOM COLOR PICKER -->
    <div id="color-modal" class="custom-modal hidden">
      <div class="modal-content">
        <i class="fa-solid fa-xmark" onclick="closeModal('color-modal')" style="position:absolute; top:15px; right:15px; font-size:20px; cursor:pointer;"></i>
        <h3>Pick Any Color</h3>
        <p style="font-size:12px; color:#8696a0; margin-top:5px;">Select your custom background color</p>
        <div class="custom-picker-box">
          <input type="color" id="chat-color-input" class="color-input-picker" value="#0b141a" onchange="applyCustomColor(this.value)">
        </div>
      </div>
    </div>

    <!-- LONG PRESS CHAT ACTION SHEET -->
    <div id="action-sheet" class="custom-modal hidden" onclick="closeModal('action-sheet')">
      <div class="action-sheet-modal" onclick="event.stopPropagation()">
        <div class="action-sheet-item" onclick="togglePinChat()"><i class="fa-solid fa-thumbtack"></i> <span id="pin-text">Pin Chat</span></div>
        <div class="action-sheet-item" onclick="toggleStarChat()"><i class="fa-solid fa-star"></i> <span id="star-text">Star Chat</span></div>
        <div class="action-sheet-item" onclick="toggleMuteChat()"><i class="fa-solid fa-volume-xmark"></i> <span id="mute-text">Mute Notifications</span></div>
        <div class="action-sheet-item" onclick="toggleBlockUser()"><i class="fa-solid fa-ban"></i> <span id="block-text">Block Contact</span></div>
        <div class="action-sheet-item danger" onclick="deleteChatRoom()"><i class="fa-solid fa-trash"></i> Delete Chat</div>
      </div>
    </div>

    <!-- CALL MODAL -->
    <div id="call-modal" class="hidden">
      <div class="call-header-overlay">
        <h4 id="call-partner-name">User Name</h4>
        <p id="call-type-title">Video Call Active</p>
      </div>

      <div class="video-container">
        <video id="remote-video-stream" autoplay playsinline></video>
        <video id="local-video-stream" autoplay playsinline muted></video>
      </div>

      <div class="call-controls-bar">
        <button id="btn-toggle-mic" class="call-btn-circle" onclick="toggleMuteMic()">
          <i class="fa-solid fa-microphone"></i>
        </button>

        <button class="call-btn-circle call-btn-end" onclick="endCall()">
          <i class="fa-solid fa-phone-slash"></i>
        </button>

        <button id="btn-toggle-cam" class="call-btn-circle" onclick="toggleCamera()">
          <i class="fa-solid fa-video"></i>
        </button>
      </div>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>

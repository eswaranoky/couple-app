<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Couple App</title>

  <!-- PWA Manifest & Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff4b2b">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #111111;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #install-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      width: 100%;
      max-width: 400px;
    }

    .app-icon {
      width: 100px;
      height: 100px;
      border-radius: 22px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(255, 75, 43, 0.3);
    }

    .app-title { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
    .app-desc { font-size: 14px; color: #aaaaaa; margin-bottom: 30px; line-height: 1.5; }

    .btn-install {
      background: linear-gradient(135deg, #ff4b2b, #ff416c);
      color: #ffffff;
      border: none;
      padding: 16px 36px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(255, 75, 43, 0.4);
      width: 100%;
    }

    #main-app {
      display: none;
      width: 100%;
      min-height: 100vh;
      padding: 20px;
    }
  </style>
</head>
<body>

  <!-- SCREEN 1: Web Browser-la Open Panna -->
  <div id="install-screen">
    <img src="https://cdn-icons-png.flaticon.com/512/1077/1077035.png" alt="App Icon" class="app-icon">
    <div class="app-title">Couple App ❤️</div>
    <div class="app-desc">Indha app-ah use panna unga mobile-la install pannanum. Keezhe irukkura button-ah press pannunga!</div>
    
    <button id="installBtn" class="btn-install">Install App</button>
  </div>

  <!-- SCREEN 2: App Install Aana Appram Inside Home Screen -->
  <div id="main-app">
    <h2>Welcome Inside Couple App! 🎉</h2>
    <p>App Success-a Install Aagiduchu!</p>
  </div>

  <script>
    const installBtn = document.getElementById('installBtn');
    const installScreen = document.getElementById('install-screen');
    const mainApp = document.getElementById('main-app');
    let deferredPrompt;

    // Standalone (Installed) Mode Check
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
      installScreen.style.display = 'none';
      mainApp.style.display = 'block';
    }

    // Capture Browser Native Install Prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    // Install Button Click Handler
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('App Installed!');
        }
        deferredPrompt = null;
      } else {
        alert("Browser menu (⋮) -> 'Add to Home Screen' / 'Install App' choose pannunga bro!");
      }
    });

    // Service Worker Register
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>

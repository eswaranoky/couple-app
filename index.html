<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="app-title-head">WhatsApp Web</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#075e54">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PeerJS Direct WebRTC Library -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div class="app-container">

    <!-- SCREEN 1: LOGIN -->
    <div id="screen-login" class="screen active">
      <div class="auth-box">
        <i class="fa-brands fa-whatsapp main-icon"></i>
        <h2>Welcome</h2>
        <p class="subtitle">Sign in with Google to continue</p>
        <button class="google-btn" onclick="loginWithGoogle()">
          <i class="fa-brands fa-google"></i> Continue with Google
        </button>
      </div>
    </div>

    <!-- SCREEN 1.5: PWA INSTALL SCREEN -->
    <div id="screen-install" class="screen">
      <div class="auth-box">
        <i class="fa-solid fa-mobile-screen-button main-icon" style="color:#25d366;"></i>
        <h2>Install Application</h2>
        <p class="subtitle">Get the full native app experience on your phone!</p>
        <button id="install-screen-btn" class="google-btn" style="background:#25d366;" onclick="installAppDirect()">
          <i class="fa-solid fa-download"></i> Install App Now
        </button>
        <button onclick="skipInstallAndGoHome()" style="margin-top:15px; background:transparent; border:none; color:#666; cursor:pointer; font-weight:bold;">
          Continue in Web Browser
        </button>
      </div>
    </div>

    <!-- SCREEN 2: HOME SCREEN WITH TABS (CHATS / STATUS) -->
    <div id="screen-home" class="screen">
      <div class="chat-header">
        <h3 id="app-display-title">WhatsApp</h3>
        <div class="header-actions">
          <i class="fa-solid fa-gear" onclick="openSettings()"></i>
          <i class="fa-solid fa-right-from-bracket" onclick="logout()"></i>
        </div>
      </div>

      <!-- TABS HEADER -->
      <div class="tab-header">
        <div id="tab-chats-btn" class="tab-btn active" onclick="switchTab('chats')">CHATS</div>
        <div id="tab-status-btn" class="tab-btn" onclick="switchTab('status')">STATUS</div>
      </div>

      <!-- TAB 1: CHATS VIEW -->
      <div id="tab-chats-content" class="tab-content active">
        <div class="search-section">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="email" id="search-email-input" placeholder="Search user by Email..." onkeyup="searchUser()">
          </div>
          <div id="search-results" class="search-results-list hidden"></div>
        </div>

        <div id="requests-section" class="requests-section hidden">
          <h4>Friend Requests</h4>
          <div id="requests-list"></div>
        </div>

        <div class="chat-list-section">
          <h4>Chats</h4>
          <div id="recent-chats-list"></div>
        </div>
      </div>

      <!-- TAB 2: STATUS VIEW -->
      <div id="tab-status-content" class="tab-content hidden">
        <div class="status-section">
          <div class="my-status-card" style="display:flex; align-items:center; padding:15px; gap:15px;">
            <div class="status-avatar-wrapper" onclick="triggerMyStatusAction()" style="position:relative; cursor:pointer;">
              <img id="my-status-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="My Status">
            </div>
            <div class="status-info" onclick="triggerMyStatusAction()" style="flex:1; cursor:pointer;">
              <b>My Status</b>
              <p id="my-status-subtext" style="font-size:12px; color:#8696a0;">Tap to add status update</p>
            </div>
            <div class="status-actions-btns" style="display:flex; gap:15px; font-size:18px;">
              <label for="status-file-input" style="cursor:pointer;" title="Add Photo Status">
                <i class="fa-solid fa-camera"></i>
              </label>
              <input type="file" id="status-file-input" accept="image/*" style="display:none;" onchange="uploadStatusPhoto(event)">
              <i class="fa-solid fa-music" onclick="openAudioTextStatusModal()" style="cursor:pointer;" title="Add Text Status"></i>
            </div>
          </div>

          <h4 style="margin: 15px 0 10px 15px; color: #00a884; font-size: 12px;">RECENT UPDATES</h4>
          <div id="recent-statuses-list"></div>
        </div>
      </div>

    </div>

    <!-- SCREEN 3: INDIVIDUAL CHAT ROOM -->
    <div id="screen-chat" class="screen">
      <div class="chat-header">
        <div class="user-info" style="display:flex; align-items:center; gap:10px;">
          <i class="fa-solid fa-arrow-left back-btn" onclick="openHome()" style="cursor:pointer;"></i>
          <img id="chat-header-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" style="width:35px; height:35px; border-radius:50%;">
          <div>
            <h4 id="chat-header-name" style="font-size:15px;">Name</h4>
            <span class="status" style="font-size:11px; color:#25d366;">Online</span>
          </div>
        </div>
        <div class="header-actions">
          <i class="fa-solid fa-video call-btn" onclick="startCall('video')"></i>
          <i class="fa-solid fa-phone call-btn" onclick="startCall('voice')"></i>
        </div>
      </div>

      <div class="chat-messages" id="chat-box"></div>

      <!-- INPUT AREA -->
      <div class="chat-input-area">
        <label for="img-attach" class="attach-btn" title="Send Image">
          <i class="fa-solid fa-paperclip"></i>
        </label>
        <input type="file" id="img-attach" accept="image/*" style="display:none;" onchange="sendMediaMessage(event)">

        <input type="text" id="msg-input" placeholder="Type a message...">

        <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane" style="color:#00a884;"></i></button>
      </div>
    </div>

    <!-- REAL-TIME FULLSCREEN VIDEO & VOICE CALL MODAL -->
    <div id="call-modal" class="hidden">
      <div class="call-header-overlay">
        <h4 id="call-partner-name">User Name</h4>
        <p id="call-type-title">Video Call Active</p>
      </div>

      <div class="video-container">
        <video id="remote-video-stream" autoplay playsinline></video>
        <video id="local-video-stream" autoplay playsinline muted></video>
      </div>

      <div class="call-controls-bar">
        <button id="btn-toggle-mic" class="call-btn-circle" onclick="toggleMuteMic()" title="Mute/Unmute Mic">
          <i class="fa-solid fa-microphone"></i>
        </button>

        <!-- RED CUT CALL BUTTON -->
        <button class="call-btn-circle call-btn-end" onclick="endCall()" title="End Call">
          <i class="fa-solid fa-phone-slash"></i>
        </button>

        <button id="btn-toggle-cam" class="call-btn-circle" onclick="toggleCamera()" title="Turn Off/On Camera">
          <i class="fa-solid fa-video"></i>
        </button>
      </div>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>

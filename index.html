<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="app-title-head">WhatsApp Web</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#075e54">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="app-container">

    <!-- SCREEN 1: LOGIN -->
    <div id="screen-login" class="screen active">
      <div class="auth-box">
        <i class="fa-brands fa-whatsapp main-icon"></i>
        <h2>Welcome</h2>
        <p class="subtitle">Sign in with Google to continue</p>
        <button class="google-btn" onclick="loginWithGoogle()">
          <i class="fa-brands fa-google"></i> Continue with Google
        </button>
      </div>
    </div>

    <!-- SCREEN 2: HOME SCREEN -->
    <div id="screen-home" class="screen">
      <div class="chat-header">
        <h3 id="app-display-title">WhatsApp</h3>
        <div class="header-actions">
          <button id="install-pwa-btn" class="install-btn hidden" onclick="installApp()"><i class="fa-solid fa-download"></i> Install</button>
          <i class="fa-solid fa-gear" onclick="openSettings()"></i>
          <i class="fa-solid fa-right-from-bracket" onclick="logout()"></i>
        </div>
      </div>

      <!-- SEARCH BAR -->
      <div class="search-section">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="email" id="search-email-input" placeholder="Search user by Email..." onkeyup="searchUser()">
        </div>
        <div id="search-results" class="search-results-list hidden"></div>
      </div>

      <!-- PENDING REQUESTS -->
      <div id="requests-section" class="requests-section hidden">
        <h4>Friend Requests</h4>
        <div id="requests-list"></div>
      </div>

      <!-- RECENT CHATS LIST -->
      <div class="chat-list-section">
        <h4>Chats</h4>
        <div id="recent-chats-list"></div>
      </div>
    </div>

    <!-- SCREEN 3: INDIVIDUAL CHAT ROOM -->
    <div id="screen-chat" class="screen">
      <div class="chat-header">
        <div class="user-info">
          <i class="fa-solid fa-arrow-left back-btn" onclick="openHome()"></i>
          <img id="chat-header-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Avatar">
          <div>
            <h4 id="chat-header-name">User</h4>
            <span class="status">Online</span>
          </div>
        </div>
        <div class="header-actions">
          <i class="fa-solid fa-video call-btn" onclick="startCall('video')"></i>
          <i class="fa-solid fa-phone call-btn" onclick="startCall('voice')"></i>
        </div>
      </div>

      <div class="chat-messages" id="chat-box"></div>

      <!-- INPUT AREA WITH MEDIA, VOICE, VIEW ONCE & TEXT -->
      <div class="chat-input-area">
        <label for="img-attach" class="attach-btn" title="Send Image">
          <i class="fa-solid fa-paperclip"></i>
        </label>
        <input type="file" id="img-attach" accept="image/*" style="display:none;" onchange="sendMediaMessage(event)">

        <label for="viewonce-attach" class="attach-btn viewonce-btn" title="Send View Once Photo">
          <i class="fa-solid fa-1"></i>
        </label>
        <input type="file" id="viewonce-attach" accept="image/*" style="display:none;" onchange="sendViewOnceMessage(event)">

        <input type="text" id="msg-input" placeholder="Type an encrypted message...">

        <button id="voice-btn" onmousedown="startRecording()" onmouseup="stopRecording()" class="mic-btn" title="Hold to record audio">
          <i class="fa-solid fa-microphone"></i>
        </button>

        <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>

    <!-- SCREEN 4: SETTINGS -->
    <div id="screen-settings" class="screen">
      <div class="settings-header">
        <i class="fa-solid fa-arrow-left" onclick="openHome()"></i>
        <h3>Settings</h3>
      </div>
      <div class="settings-body">
        <div class="profile-preview-box">
          <img id="settings-avatar-preview" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Avatar">
          <label for="profile-pic-file" class="change-photo-btn"><i class="fa-solid fa-camera"></i> Change Photo</label>
          <input type="file" id="profile-pic-file" accept="image/*" style="display:none;" onchange="handleProfilePhoto(event)">
        </div>

        <div class="input-group">
          <label><i class="fa-solid fa-user"></i> Display Name</label>
          <input type="text" id="edit-display-name" placeholder="Your Name">
        </div>

        <div class="input-group">
          <label><i class="fa-solid fa-circle-info"></i> About / Bio</label>
          <input type="text" id="edit-user-bio" placeholder="Hey there! I am using WhatsApp.">
        </div>

        <div class="settings-option-item">
          <span><i class="fa-solid fa-bell"></i> Chat Notifications</span>
          <input type="checkbox" checked>
        </div>

        <div class="settings-option-item">
          <span><i class="fa-solid fa-shield-halved"></i> Privacy & E2E Encryption</span>
          <span class="badge">Active</span>
        </div>

        <button id="save-settings-btn" onclick="saveSettings()">Save Changes</button>
      </div>
    </div>

    <!-- PHOTO VIEWER MODAL WITH 3-DOT MENU -->
    <div id="photo-viewer-modal" class="modal hidden">
      <div class="modal-header">
        <span class="close-modal" onclick="closePhotoViewer()">&times;</span>
        <div class="dropdown">
          <i class="fa-solid fa-ellipsis-vertical dropbtn" onclick="togglePhotoMenu()"></i>
          <div id="photo-menu" class="dropdown-content hidden">
            <a id="hd-download-link" download="photo_hd.jpg" target="_blank"><i class="fa-solid fa-download"></i> Download HD Image</a>
            <a onclick="openFullImageWindow()"><i class="fa-solid fa-up-right-and-pointer"></i> Open in New Tab</a>
          </div>
        </div>
      </div>
      <div class="modal-body">
        <img id="modal-viewer-img" src="" alt="View Photo">
      </div>
    </div>

    <!-- VIDEO/VOICE CALL MODAL -->
    <div id="call-modal" class="modal hidden">
      <div class="modal-header">
        <span id="call-type-title">Call Status</span>
        <span class="close-modal" onclick="endCall()">&times;</span>
      </div>
      <div class="modal-body call-container">
        <iframe id="jitsi-iframe" allow="camera; microphone; display-capture"></iframe>
      </div>
    </div>

  </div>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>

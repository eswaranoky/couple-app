<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Styles -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b141a;
      color: #e9edef;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Auth Screen */
    #auth-screen {
      background: #111b21;
      padding: 30px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    #auth-screen h2 {
      text-align: center;
      color: #00a884;
    }

    #auth-screen input, #auth-screen button {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #2a3942;
      background: #202c33;
      color: #fff;
      font-size: 14px;
    }

    #auth-screen button {
      background: #00a884;
      color: #111b21;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    /* Chat Screen Container */
    #chat-screen {
      width: 100%;
      max-width: 450px;
      height: 100vh;
      background: #0b141a;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: #202c33;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-bottom: 1px solid #2a3942;
    }

    header .title {
      font-weight: bold;
      color: #00a884;
    }

    header .subtitle {
      font-size: 12px;
      color: #8696a0;
    }

    /* Chat Messages Box */
    #chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Message Bubbles */
    .msg-bubble {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      position: relative;
      word-break: break-word;
      transition: transform 0.1s ease-out;
    }

    .msg-bubble.me {
      align-self: flex-end;
      background-color: #005c4b;
      color: #e9edef;
      border-bottom-right-radius: 2px;
    }

    .msg-bubble.partner {
      align-self: flex-start;
      background-color: #202c33;
      color: #e9edef;
      border-bottom-left-radius: 2px;
    }

    .call-log-msg {
      align-self: center;
      background: #182229;
      color: #8696a0;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 20px;
      margin: 8px 0;
    }

    /* Reply Preview Box inside Message */
    .reply-preview-box {
      background: rgba(0, 0, 0, 0.2);
      border-left: 3px solid #00a884;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      margin-bottom: 6px;
      color: #d1d7db;
    }

    .chat-img-hd {
      width: 100%;
      max-width: 220px;
      border-radius: 8px;
      cursor: pointer;
      display: block;
      margin-bottom: 4px;
    }

    .msg-meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      float: right;
      margin-top: 4px;
      margin-left: 8px;
      font-size: 11px;
    }

    .delete-btn {
      color: #ff4d4d;
      cursor: pointer;
      font-size: 12px;
      padding: 2px;
    }

    .delete-btn:hover {
      opacity: 0.8;
    }

    .blue-tick {
      color: #53bdeb;
    }

    .view-once-btn {
      background: #202c33;
      color: #00a884;
      border: 1px solid #00a884;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
    }

    /* Reply Preview Header Banner */
    #reply-preview {
      background: #182229;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid #00a884;
      font-size: 13px;
    }

    #reply-preview .close-btn {
      cursor: pointer;
      color: #8696a0;
    }

    /* Input Footer */
    footer {
      background: #202c33;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    footer input[type="text"] {
      flex: 1;
      background: #2a3942;
      border: none;
      padding: 10px 14px;
      border-radius: 20px;
      color: #fff;
      outline: none;
      font-size: 14px;
    }

    footer button {
      background: #00a884;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: #111b21;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Lightbox Modal */
    #lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 8px;
    }

    #lightbox .close-lightbox-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Auth Screen -->
  <div id="auth-screen">
    <h2>Join Chat</h2>
    <input type="email" id="user-email" placeholder="Your Email Address">
    <input type="text" id="room-id" placeholder="Room ID (e.g. room123)">
    <button onclick="loginUser()">Enter Chat</button>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen" style="display: none;">
    <header>
      <div class="title" id="display-room">Room: -</div>
      <div class="subtitle" id="display-user">User: -</div>
    </header>

    <div id="chat-box"></div>

    <!-- Active Reply Banner -->
    <div id="reply-preview" style="display: none;">
      <div>
        <span style="color: #00a884; font-weight: bold;">Replying to:</span>
        <span id="reply-text" style="color: #8696a0; margin-left: 6px;"></span>
      </div>
      <i class="fa-solid fa-xmark close-btn" onclick="clearReply()"></i>
    </div>

    <!-- Input Bar -->
    <footer>
      <input type="text" id="msg-input" placeholder="Type a message...">
      <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </footer>
  </div>

  <!-- Image Lightbox Modal -->
  <div id="lightbox" style="display: none;" onclick="closeLightbox()">
    <i class="fa-solid fa-xmark close-lightbox-btn"></i>
    <img id="lightbox-img" src="" alt="Enlarged View">
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  
  <!-- Main Script -->
  <script src="app.js"></script>
</body>
</html>

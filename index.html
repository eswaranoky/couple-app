<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Couple App</title>

  <!-- Dynamic PWA Manifest Integration -->
  <script>
    const manifestData = {
      "name": "Couple App",
      "short_name": "CoupleApp",
      "start_url": "/",
      "display": "standalone",
      "background_color": "#111111",
      "theme_color": "#ff4b2b",
      "icons": [
        {
          "src": "https://cdn-icons-png.flaticon.com/512/1077/1077035.png",
          "sizes": "192x192",
          "type": "image/png"
        },
        {
          "src": "https://cdn-icons-png.flaticon.com/512/1077/1077035.png",
          "sizes": "512x512",
          "type": "image/png"
        }
      ]
    };
    const stringManifest = JSON.stringify(manifestData);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestURL;
    document.head.appendChild(link);
  </script>

  <meta name="theme-color" content="#ff4b2b">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #111111;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow-x: hidden;
    }

    /* --- 1. INSTALL SCREEN STYLING --- */
    #install-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      width: 100%;
      max-width: 400px;
    }

    .app-icon {
      width: 100px;
      height: 100px;
      border-radius: 22px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(255, 75, 43, 0.3);
    }

    .app-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .app-desc {
      font-size: 14px;
      color: #aaaaaa;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .btn-install {
      background: linear-gradient(135deg, #ff4b2b, #ff416c);
      color: #ffffff;
      border: none;
      padding: 16px 36px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(255, 75, 43, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    .btn-install:active {
      transform: scale(0.97);
    }

    .guide-text {
      font-size: 12px;
      color: #888888;
      margin-top: 15px;
      display: none;
    }

    /* --- 2. MAIN APP SCREEN (App Install Aana Appram thaan Theriya Varum) --- */
    #main-app {
      display: none;
      width: 100%;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .app-header {
      padding: 20px 0;
      border-bottom: 1px solid #333;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <!-- SCREEN 1: Chrome / Browser-la Open Panna Idhu Mattum Kaattum -->
  <div id="install-screen">
    <img src="https://cdn-icons-png.flaticon.com/512/1077/1077035.png" alt="App Icon" class="app-icon">
    <div class="app-title">Couple App ❤️</div>
    <div class="app-desc">Indha app-ah use panna unga mobile-la install pannanum. Keezhe irukkura button-ah press pannunga!</div>
    
    <button id="installBtn" class="btn-install">Install App</button>
    <div id="guideText" class="guide-text">
      Chrome Menu (⋮) press panni <b>"Add to Home Screen"</b> or <b>"Install App"</b> choose pannunga.
    </div>
  </div>

  <!-- SCREEN 2: Install Panni Mobile Home Screen-la Irundhu Open Panna Idhu Dhaan Varum -->
  <div id="main-app">
    <div class="app-header">
      <h2>Welcome Inside Couple App! 🎉</h2>
      <p>App Install Aagiduchu! Inga unga features-ah use pannalaam.</p>
    </div>
  </div>

  <script>
    const installBtn = document.getElementById('installBtn');
    const installScreen = document.getElementById('install-screen');
    const mainApp = document.getElementById('main-app');
    const guideText = document.getElementById('guideText');
    let deferredPrompt;

    // Check if opening as Standalone Installed App
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    if (isStandalone) {
      installScreen.style.display = 'none';
      mainApp.style.display = 'block';
    } else {
      installScreen.style.display = 'flex';
      mainApp.style.display = 'none';
    }

    // Capture install prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
      guideText.style.display = 'none';
    });

    // Install Button Click Handler
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('User installed the PWA');
        }
        deferredPrompt = null;
      } else {
        guideText.style.display = 'block';
      }
    });

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request)));
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swURL = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swURL).catch(() => {});
    }
  </script>
</body>
</html>
